<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edunext - Student Resource Hub</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Our own CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Edunext</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="browser.html">Browse</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="upload.html">Upload</a></li>
        </ul>
        <a class="nav-link" href="login.html">Login <i class="bi bi-person-circle ms-1"></i></a>
      </div>
    </div>
  </nav>

  <section class="hero-section">
    <div class="row align-items-center">
      <div class="col-lg-6">
        <h1 class="display-5 fw-bold mb-4"> Findthe study material you need, shared by your fellow students.</h1>

        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="search resources...">
          <button class="btn btn-primary" type="submit">search</button>
        </form>
      </div>
      <div class="col-lg-6 mt-4 mt-lg-0">
        
        <img src="image/meeting.png" alt="Students studying together">
      </div>
    </div>
  </section>

  <section class="container" id="recent-resources">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-bold">Recently added resources</h3>
      <a href="browse.html" class="text-decoration-none">View all</a>
    </div>

    <div class="row g-4 mb-5">
      <div class="col-md-4">
        <div class="resource-card">
         
          <img src="image/table - Copy.png" alt="Web Technologies">
          <div class="p-3">
            <h6 class="fw-bold mb-0">Web Technologies</h6>
            <small class="text-muted">Assesssment</small>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="resource-card">
         
          <img src="image/tab - Copy.png" alt="Multimedia">
          <div class="p-3">
            <h6 class="fw-bold mb-0">Multimedia</h6>
            <small class="text-muted">Tutorials</small>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="resource-card">
         
          <img src="image/books.png" alt="Skills Development">
          <div class="p-3">
            <h6 class="fw-bold mb-0">Skills Development</h6>
            <small class="text-muted">Notes</small>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="d-flex justify-content-between align-items-center flex-wrap">
    <small>&copy; 2024 Edunext Inc. All rights reserved.</small>
    <div>
      <a href="#" class="text-muted me-3" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
      <a href="#" class="text-muted me-3" aria-label="GitHub"><i class="bi bi-github"></i></a>
      <a href="#" class="text-muted me-3" aria-label="Discord"><i class="bi bi-discord"></i></a>
      <a href="#" class="text-muted" aria-label="Email"><i class="bi bi-envelope"></i></a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>

</html>
